<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GM Dental · Gold Card</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 1rem;
    }
    .container { max-width: 600px; margin: 0 auto; }
    header {
      text-align: center;
      margin-bottom: 2rem;
      color: #d4af37;
      font-size: 1.25rem;
      font-weight: 600;
    }
    .card {
      background: linear-gradient(135deg, #d4af37, #aa8c2a);
      border-radius: 1rem;
      padding: 2rem;
      margin-bottom: 2rem;
      color: #0f172a;
      text-align: center;
    }
    .card-name { font-size: 1.5rem; font-weight: 700; margin-bottom: 1rem; }
    .card-code { font-size: 0.875rem; opacity: 0.8; margin-bottom: 1.5rem; }
    .qr { margin: 1.5rem 0; }
    .qr img { max-width: 200px; width: 100%; height: auto; }
    .section { background: rgba(15, 23, 42, 0.5); border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 1.5rem; }
    .section-title { color: #d4af37; font-weight: 600; margin-bottom: 1rem; }
    .share-link {
      background: #1e293b;
      padding: 1rem;
      border-radius: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .share-link input {
      flex: 1;
      background: transparent;
      border: none;
      color: #d4af37;
      font-size: 0.875rem;
      padding: 0;
    }
    .share-link input:focus { outline: none; }
    .share-link button {
      background: #d4af37;
      color: #0f172a;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.875rem;
    }
    .share-link button:hover { background: #e8c547; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
    .stat-chip {
      background: #1e293b;
      padding: 1rem;
      border-radius: 0.5rem;
      text-align: center;
    }
    .stat-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 0.25rem; }
    .stat-value { font-size: 1.25rem; color: #d4af37; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th {
      text-align: left;
      padding: 0.75rem;
      border-bottom: 1px solid #334155;
      color: #d4af37;
      font-weight: 600;
    }
    td { padding: 0.75rem; border-bottom: 1px solid #334155; }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-pending { background: #fbbf24; color: #78350f; }
    .badge-approved { background: #10b981; color: #ecfdf5; }
    .badge-paid { background: #3b82f6; color: #eff6ff; }
    .badge-void { background: #6b7280; color: #f3f4f6; }
    footer {
      text-align: center;
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>GM Dental · Gold Card</header>
    <div class="card">
      <div class="card-name">{{name}}</div>
      <div class="card-code">{{code}}</div>
      <div class="qr"><img src="{{qrDataUrl}}" alt="QR Code"></div>
    </div>
    <div class="section">
      <div class="section-title">Share your link</div>
      <div class="share-link">
        <input type="text" value="{{referralUrl}}" readonly>
        <button onclick="copyLink()">Copy</button>
      </div>
    </div>
    <div class="section">
      <div class="section-title">Your rewards</div>
      <div class="stats">
        <div class="stat-chip">
          <div class="stat-label">Pending</div>
          <div class="stat-value">{{totalPending}}</div>
        </div>
        <div class="stat-chip">
          <div class="stat-label">Paid</div>
          <div class="stat-value">{{totalPaid}}</div>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Amount</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          {{rewardsRows}}
        </tbody>
      </table>
    </div>
    <footer>Rewards are credited when your friend completes treatment. Terms apply.</footer>
  </div>
  <script>
    function copyLink() {
      const input = document.querySelector('.share-link input');
      navigator.clipboard.writeText(input.value).then(() => {
        alert('Link copied!');
      });
    }
  </script>
</body>
</html>
