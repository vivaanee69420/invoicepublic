<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Planner — Unified Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>" />
</head>
<body>
  <header>
    <div class="brand">🗂️ My Planner <span>· all workspaces, one board</span></div>
    <div class="datenav">
      <button id="prevDay" class="ghost" title="Previous day">‹</button>
      <span class="date-label" id="dateLabel">…</span>
      <button id="nextDay" class="ghost" title="Next day">›</button>
      <button id="todayBtn">Today</button>
    </div>
    <div class="chips" id="wsChips"></div>
    <div class="spacer"></div>
    <span class="live offline" id="liveDot"><span class="pulse"></span><span id="liveText">connecting…</span></span>
    <nav><a href="staff.html">Staff portal</a></nav>
    <button id="keyBtn" class="ghost" title="Set your API key">🔑 <span id="keyWho">Sign in</span></button>
  </header>

  <main>
    <div class="board" id="board"></div>
  </main>

  <dialog id="keyDialog">
    <h3>Enter your API key</h3>
    <p>Checking off tasks and adding items needs your personal API key. It is stored only in this browser.</p>
    <input type="password" id="keyInput" placeholder="e.g. owner-demo-key" />
    <div class="dlg-actions">
      <button id="keyCancel">Cancel</button>
      <button id="keySave" class="primary">Save</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
